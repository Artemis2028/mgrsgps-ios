# XcodeGen spec. The .xcodeproj is generated, never committed — a hand-edited
# pbxproj is the single most common source of "works on my machine" in iOS,
# and this file is reviewable in a way that one is not.
#
#   brew install xcodegen && xcodegen generate && open MGRSGPS.xcodeproj
name: MGRSGPS
options:
  bundleIdPrefix: app.gridfix
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  GridFixCore:
    path: GridFixCore
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

targets:
  MGRSGPS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/MapAssets
        buildPhase: resources
      - path: App/Resources/MilitarySymbols
        type: folder
        buildPhase: resources
    dependencies:
      - target: GridFixWatch
        embed: true
      - package: GridFixCore
        product: GridFixCore
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gridfix.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: App/Resources/MGRSGPS.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Resources/Info.generated.plist
      properties:
        CFBundleDisplayName: MGRS GPS
        GridFixEsriKey: $(GRIDFIX_ESRI_API_KEY)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.gridfix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type: application/gpx+xml
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: >-
          MGRS GPS uses precise location to show your grid, record tracks and
          alert when you cross a drawn boundary. After you start recording or
          monitoring, location continues while locked. Field data stays on your device.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Background access lets MGRS GPS keep recording a track while the
          screen is off. Nothing leaves the phone.
        UIBackgroundModes:
          - location

  GridFixWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
        buildPhase: resources
    dependencies:
      - package: GridFixCore
        product: GridFixCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gridfix.ios.watchkitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.generated.plist
      properties:
        CFBundleDisplayName: GridFix
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.gridfix.ios
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: GridFix uses your location while open to show your current grid and bearing to your selected waypoint.
        UIAppFonts:
          - antonio.ttf
          - fira_mono_regular.ttf
          - saira_semi_condensed_semibold.ttf

  MGRSGPSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Tests
      - path: GridFixCore/Tests/GridFixCoreTests/Resources/android-backup-contract.zip
        buildPhase: resources
    dependencies:
      - target: MGRSGPS
      - package: GridFixCore
        product: GridFixCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gridfix.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

  MGRSGPSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: MGRSGPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gridfix.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  MGRSGPS:
    build:
      targets:
        MGRSGPS: all
    test:
      targets:
        - MGRSGPSTests
        - MGRSGPSUITests
  GridFixWatch:
    build:
      targets:
        GridFixWatch: all
