name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed only to publish the ci-status branch at the end. No other secret is
# used anywhere in this workflow: a Simulator build is unsigned and the map
# style is keyless, so nothing here needs a MapTiler key or a signing keystore.
permissions:
  contents: write

# The Android pipeline learned this the hard way: a red test must not be able
# to produce an artifact that looks shippable. Same rule here — the build and
# the screenshots are gated on the field math passing first.
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain we actually got
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Field math (GridFixCore)
        id: tests
        working-directory: GridFixCore
        run: |
          # Without pipefail the step's exit status is tee's, which is always
          # zero: run 2 reported tests=success while the compiler was failing.
          set -o pipefail
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project MGRSGPS.xcodeproj

      - name: Build for the Simulator
        id: build
        run: |
          set -o pipefail
          DEST=$(./scripts/pick-simulator.sh | cut -f1)
          echo "building for $DEST"
          xcodebuild build \
            -project MGRSGPS.xcodeproj \
            -scheme MGRSGPS \
            -configuration Debug \
            -destination "id=$DEST" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -n 40

      - name: Screenshots
        run: |
          APP=$(find build/Build/Products -maxdepth 4 -name "MGRSGPS.app" | head -n 1)
          echo "app: $APP"
          ./scripts/simulator-shots.sh "$APP" screenshots

      - name: Upload the build and the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgrsgps-ios-${{ github.run_number }}
          path: |
            screenshots/
            build.log
            test.log
          if-no-files-found: warn

      # Publish the outcome and the logs to a branch, so they can be read with
      # a plain git fetch. The Actions API needs a token; a branch does not,
      # and on a public repo that makes every run diagnosable from anywhere.
      - name: Publish the run outcome to the ci-status branch
        if: always()
        run: |
          mkdir -p /tmp/status
          {
            echo "run=${{ github.run_number }}"
            echo "sha=${GITHUB_SHA:0:7}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "finished=$(date -u +%FT%TZ)"
          } > /tmp/status/outcome.txt
          cp "$GITHUB_WORKSPACE/test.log" /tmp/status/testlog.txt 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build.log" /tmp/status/buildlog.txt 2>/dev/null || true
          # The screenshots and the app's own log go here too. They are the
          # only evidence for anything that is wrong on screen rather than in a
          # test, and downloading a run artifact needs a token where a branch
          # does not. Force-pushed to an orphan branch each run, so nothing
          # accumulates.
          cp screenshots/*.png /tmp/status/ 2>/dev/null || true
          cp screenshots/app.log /tmp/status/applog.txt 2>/dev/null || true
          cat /tmp/status/outcome.txt
          cd /tmp/status
          git init -q -b ci-status
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "run ${{ github.run_number }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            ci-status
